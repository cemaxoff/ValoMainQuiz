<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>ValoMainQuiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

  body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #111111, #111111, #111111);
  min-height: 100vh;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px; /* pour que ce soit pas collé aux bords */
  box-sizing: border-box;
}

#logo img {
  border-radius: 12px; /* coins arrondis */
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

#logo {
  position: absolute;
  top: 12px;   /* distance du haut */
  left: 12px;  /* distance de la gauche */
  z-index: 1000; /* pour qu’il soit au-dessus des autres éléments */
}

#logo img {
  display: block;
  width: 80px; /* ajuste la taille du logo */
  height: auto;
}


.ad-left,
.ad-right {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 160px; /* largeur pub latérale */
  height: auto;
  background: #222;
  padding: 10px;
  box-shadow: 0 0 8px rgba(0,0,0,0.4);
  z-index: 1000;
}


.ad-left img,
.ad-right img {
  border-radius: 12px;
  transition: transform 0.3s ease;
}

.ad-left img:hover,
.ad-right img:hover {
  transform: scale(1.05);
}

.ad-left {
  left: 0; /* à gauche */
}

.ad-right {
  right: 0; /* à droite */
}

/* sur mobile on cache ces pubs */
@media screen and (max-width: 768px) {
  .ad-left,
  .ad-right {
    display: none;
  }
}

.box {
  width: 100%;
  max-width: 420px; /* reste la même sur grand écran */
  background: rgba(17, 17, 17, 0.95);
  padding: 24px 16px; /* réduit légèrement pour mobile */
  border-radius: 18px;
  box-shadow: 0 25px 50px rgba(236, 231, 225, 0.1);
  backdrop-filter: blur(6px);
  box-sizing: border-box;
}

  button {
    font-family: "Inter", sans-serif;
    width: 100%;
    padding: 14px; /* un peu plus confortable pour le tactile */
    margin-bottom: 12px;
    font-size: 16px; /* légèrement plus grand pour lisibilité sur mobile */
    font-weight: 500;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #FF4655, #FF4655);
    color: #111111;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    transition: all 0.2s ease;
  }

 button:hover {
  transform: translateY(-1px);
  background: linear-gradient(135deg, #d1d5db, #f3f4f6);
 }

  #backArrow {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 24px;
    cursor: pointer;
    z-index: 10;
  }


  h2 {
    font-size: 22px;
    color: #ECE7E1;
    margin-bottom: 8px;
  }

  descr{
    color:#ECE7E1
  }

  #progress {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 24px;
  }

  button:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #d1d5db, #f3f4f6);
  }

  button:active {
    transform: translateY(0);
    box-shadow: 0 4px 8px rgba(236, 231, 225, 0.1);
  }

  .result-controller {
    color: #ECE7E1;
  }

  .result-duellist {
    color: #ECE7E1;
  }

  .result-sentinel {
    color: #ECE7E1;
  }

  .result-initiator {
    color: #ECE7E1;
  }

  .advice {
    margin-top: 14px;
    font-size: 15px;
    color: #ECE7E1;
    line-height: 1.6;
  }

  .progress-bar {
  width: 100%;
  height: 6px;
  background: #e5e7eb;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #FF4655, #ff3041);
  transition: width 0.4s ease;
}

.fade {
  animation: fadeSlide 0.35s ease;
}

@keyframes fadeSlide {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.percent-container {
  margin-bottom: 20px;
}

.percent-label {
  font-size: 14px;
  font-weight: 500;
  color: #ECE7E1;
  margin-bottom: 6px;
}

.percent-bar {
  width: 100%;
  height: 10px;
  background: #e5e7eb;
  border-radius: 999px;
  overflow: hidden;
}

.percent-fill {
  height: 100%;
  background: linear-gradient(90deg, #22c55e, #16a34a);
  border-radius: 999px;
  transition: width 0.6s ease;
}

</style>

</head>
<body>
  <header>
    <div id="logo" style="text-align:center; margin-bottom:20px;">
      <img src="https://cemaxoff.github.io/ValoMainQuiz/ValoMainQuiz/images/logo.png" alt="Logo ValoMainQuiz" width="120">
    </div>

  </header>

<!-- PUB GAUCHE -->
<div class="ad-left">
  <a href="https://cemaxoff.github.io/CrushQuiz/" target="_blank">
    <img src="https://cemaxoff.github.io/CrushQuiz/crush-quiz/images/pub_logo-crushquiz.png" width="160">
  </a>
</div>


<!-- PUB DROITE -->
<div class="ad-right">
  <a href="https://cemaxoff.github.io/CrushQuiz/" target="_blank">
    <img src="https://cemaxoff.github.io/CrushQuiz/crush-quiz/images/pub_logo-crushquiz.png" width="160">
  </a>
</div>


<div class="box" id="app">

  <!-- ÉCRAN ACCUEIL -->
  <div id="startScreen">
    <p></p><h2>Découvre quel est ton main Valorant</h2></p>
    <button onclick="goToRole()">Commencer le ValoMainQuiz</button>
    <descr>Réponds honnêtement pour obtenir un résultat fiable.</descr>
  </div>

  <!-- ÉCRAN GENRE -->
  <div id="roleSelect" style="display:none;">
    <h2>Quel rôle te plaît le plus (pour l'instant) ?</h2>
    <button onclick="setRole('controller')">Controller (Smoker)</button>
    <button onclick="setRole('duellist')">Duellist</button>
    <button onclick="setRole('sentinel')">Sentinel</button>
    <button onclick="setRole('initiator')">Initiator</button>
  </div>


  <!-- QUIZ -->
  <div id="quiz" style="display:none;">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="backArrow" style="display:none; cursor:pointer;">⬅️</div>

    <h2 id="question"></h2>
    <p id="progress"></p>
    <div id="answers"></div>
    <div id="navButtons"></div>

  </div>

  <!-- controllerQUIZ -->
  <div id="controllerQuiz" style="display:none;">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="backArrow" style="display:none; cursor:pointer;">⬅️</div>

    <h2 id="questions"></h2>
    <p id="progress"></p>
    <div id="answers"></div>
    <div id="navButtons"></div>

  </div>

</div>

<script>

let phase = "role"; 
let index = 0;
let selectedRole = null;

let scores = {};

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const progressEl = document.getElementById("progress");
const progressFill = document.getElementById("progressFill");

function goToRole() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("roleSelect").style.display = "block";
}

function setRole(role) {
  selectedRole = role;
  document.getElementById("roleSelect").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  startRoleQuiz();
}

function startRoleQuiz() {
  phase = "role";
  index = 0;
  scores = { controller:0, duellist:0, sentinel:0, initiator:0 };
  currentQuestions = roleQuestions;
  showQuestion();
}

function startAgentQuiz() {
  phase = "agent";
  index = 0;
  scores = {};

  if(selectedRole === "controller"){
    currentQuestions = controllerQuestions;
  }

  if(selectedRole === "duellist"){
    currentQuestions = duellistQuestions;
  }

  if(selectedRole === "sentinel"){
    currentQuestions = sentinelQuestions;
  }

  if(selectedRole === "initiator"){
    currentQuestions = initiatorQuestions;
  }

  showQuestion();
}


let currentQuestions = [];

function showQuestion() {

  const q = currentQuestions[index];

  questionEl.textContent = q.question;
  progressEl.textContent = `Question ${index+1} / ${currentQuestions.length}`;
  answersEl.innerHTML = "";

  progressFill.style.width = ((index)/currentQuestions.length)*100 + "%";

  q.answers.forEach(a => {
    const btn = document.createElement("button");
    btn.textContent = a.text;
    btn.onclick = () => handleAnswer(a.score);
    answersEl.appendChild(btn);
  });
}

function handleAnswer(score) {

  for(let key in score){
    scores[key] = (scores[key] || 0) + score[key];
  }

  index++;

  if(index < currentQuestions.length){
    showQuestion();
  } else {
    if(phase === "role"){
      showRoleResult();
    } else {
      showAgentResult();
    }
  }
}

/* ============================
   RESULT ROLE
============================ */

function showRoleResult(){

  let winner = Object.keys(scores).reduce((a,b)=> scores[a] > scores[b] ? a : b);

  let text = "";
  if(winner==="controller") text="Controller inné !";
  if(winner==="duellist") text="Duellist pur.";
  if(winner==="sentinel") text="Sentinel stratégique.";
  if(winner==="initiator") text="Initiator tactique.";

  questionEl.innerHTML = `<span class="result-${winner}">${text}</span>`;
  progressEl.textContent="";
  progressFill.style.width="100%";

  answersEl.innerHTML=`
    <p class="advice">Passons maintenant au choix précis de ton agent 👀</p>
    <button onclick="startAgentQuiz()">Continuer le quiz</button>
  `;
}

/* ============================
   RESULT AGENT
============================ */

function showAgentResult(){

  let winner = Object.keys(scores).reduce((a,b)=> scores[a] > scores[b] ? a : b);

  questionEl.innerHTML = `<span class="result-controller">${winner.toUpperCase()}</span>`;
  progressEl.textContent="";
  progressFill.style.width="100%";

  answersEl.innerHTML=`
    <p class="advice">Voilà ton main idéal 🔥</p>
    <button onclick="restartQuiz()">Recommencer</button>
  `;
}

function restartQuiz(){
  document.getElementById("quiz").style.display="none";
  document.getElementById("startScreen").style.display="block";
  progressFill.style.width="0%";
}


/* ============================
   QUESTIONS ROLE
============================ */

const roleQuestions = [
 {

    answers: [

    ]

    ]
  },
    {

    answers: [
      {text: "Ralentir les pushs ennemis avec tes utilitaires", score: {controller: 2} },
      {text: "Prendre des duels agressifs en début de round", score: {duellist: 2} },
      {text: "Tenir un site seul avec tes setups", score: {sentinel: 2} },
      {text: "Contester avec des flashs ou reveals", score: {initiator: 2} },
    ]
  },
  {
  question: "Ton style de jeu est plutôt :",
  answers: [
    {text: "Patient et réfléchi", score: {controller: 2} },
    {text: "Mécanique et agressif", score: {duellist: 2} },
    {text: "Méthodique et discipliné", score: {sentinel: 2} },
    {text: "Adaptable et communicatif", score: {initiator: 2} },
    ]
  },
  {

    {text: "Des capacités pour aveugler ou révéler", score: {initiator: 2} },
    ]
  },
  {
  question: "Ton mental en ranked :",
  answers: [
    {text: "“Je structure la game.”", score: {controller: 2} },
    {text: "“Je carry si je suis chaud.”", score: {duellist: 2} },
    {text: "“Je sécurise, on gagne sur la discipline.”", score: {sentinel: 2} },
    {text: "“Je donne les infos, on joue ensemble.”", score: {initiator: 2} },
    ]
  },
  {
  question: "Quand tu meurs, ça t’énerve surtout si :",
  answers: [
    {text: "Tes smokes n’ont pas été respectées", score: {controller: 2} },
    {text: "Tu n’as pas pu prendre ton duel", score: {duellist: 2} },
    {text: "Ton site s’est fait prendre trop facilement", score: {sentinel: 2} },
    {text: "Personne n’a suivi ton utilitaire", score: {initiator: 2} },
    ]
  },
  {
  question: "Ton rôle idéal dans une équipe :",
  answers: [
    {text: "Chef d’orchestre", score: {controller: 2} },
    {text: "Star player", score: {duellist: 2} },
    {text: "Gardien stratégique", score: {sentinel: 2} },
    {text: "Support clé", score: {initiator: 2} },
    ]
  },
];


/* ============================
   QUESTIONS CONTROLLER
============================ */

const controllerQuestions = [

    answers: [

    ]
  },

    answers: [
      { text: "Te téléporter aux alentours", score: { omen: 2 } },

    ]

  {

    answers: [

    ]
  },

]
},

</script>


</body>
